<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M.M ISLAMIC ENGLISH SCHOOL - LOGIN</title>
  
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/Dev-AmmarAhmed/mm-islamic-student-dashboard/6ffc7a916bc2902c4baea4a123634fbe732647b1/book-floating-cartoon-vector-icon-illustration-education-object-icon-isolated-flat-vector_138676-13661.jpg">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --primary-btn-bg: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg-gradient); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

    .login-box {
      background: var(--card-bg); padding: 32px 24px; border-radius: 22px; text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35); width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--border-color);
    }

    .login-box h2 { color: #0288d1; font-size: 16px; font-weight: 800; }
    .login-box h4 { color: #e65100; font-size: 12px; font-weight: 800; }
    .login-box input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; outline: none; }

    .btn-primary {
      width: 100%; padding: 13px; background: var(--primary-btn-bg); color: white; border: none;
      border-radius: 25px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .spinner {
      width: 16px; height: 16px; border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; border-top-color: #ffffff; animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Hide reCAPTCHA badge if needed */
    .grecaptcha-badge { visibility: hidden; }
  </style>
</head>
<body>

  <div class="login-box">
    <div>
      <h2>M.M ISLAMIC ENGLISH SCHOOL</h2>
      <h4>PORTAL LOGIN</h4>
    </div>
    <input type="text" id="loginUsername" placeholder="User ID / Username" autocomplete="off">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="off">
    <button id="loginBtn" class="btn-primary">PORTAL LOGIN</button>
    <p id="loginError" style="color:red; font-size:12px; display:none; line-height:1.4;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
      authDomain: "mm-islamic-erp.firebaseapp.com",
      databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
      projectId: "mm-islamic-erp",
      storageBucket: "mm-islamic-erp.firebasestorage.app",
      messagingSenderId: "547338314533",
      appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
    };

    const app = initializeApp(firebaseConfig);

    // Initialize Firebase App Check with your Site Key
    try {
      initializeAppCheck(app, {
        provider: new ReCaptchaV3Provider('6LefZbUtAAAAADOa8KBfn1qywMly7Ky2-UlX6zxW'),
        isTokenAutoRefreshEnabled: true
      });
    } catch (e) {
      console.warn("App Check initialization error:", e);
    }

    const db = getDatabase(app);

    const loginBtn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("loginError");

    loginBtn.addEventListener("click", async () => {
      const u = document.getElementById("loginUsername").value.trim();
      const p = document.getElementById("loginPassword").value.trim();

      if (!u || !p) {
        errorEl.style.display = "block";
        errorEl.innerText = "Please enter both Username and Password.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner"></span> Verifying...`;
      errorEl.style.display = "none";

      try {
        const snap = await get(child(ref(db), "users"));
        const usersData = snap.exists() ? snap.val() : {};
        const uData = usersData[u];

        if (uData && String(uData.password).trim() === p) {
          localStorage.setItem("loggedUser", u);
          localStorage.setItem("loggedPass", p);
          localStorage.setItem("loggedRole", uData.role);
          if (uData.assignedClass) localStorage.setItem("assignedClass", uData.assignedClass);
          if (uData.admn) localStorage.setItem("studentAdmn", uData.admn);

          // Relative folder redirect
          if (uData.role === "admin") {
            window.location.href = "../admindashboard/";
          } else if (uData.role === "teacher") {
            window.location.href = "../teacherdashboard/";
          } else if (uData.role === "student") {
            window.location.href = "../studentboard/";
          }
        } else {
          errorEl.style.display = "block";
          errorEl.innerText = "Invalid credentials. Please try again.";
        }
      } catch (err) {
        console.error("Login Error:", err);
        errorEl.style.display = "block";
        errorEl.innerText = "Connection Error: " + (err.message || "Failed to connect to Database");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = "PORTAL LOGIN";
      }
    });
  </script>
</body>
</html>
